[project]
name = "forgecraft"
version = "0.4.0"
description = "RL-based mechanical morphology co-evolution framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ForgeCraft Team"}
]
keywords = [
    "reinforcement-learning", "evolutionary-algorithm", "morphology",
    "robotics", "simulation", "mujoco", "genesis", "3d-printing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # 仿真与强化学习
    "torch>=2.0",
    "numpy>=1.24",
    "gymnasium>=0.29",
    "mujoco>=3.0",
    # 形态图与零件箱配置 (core 模块级导入, 缺一不可)
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    # 几何 / 网格处理 (几何生成与制造导出共用)
    "trimesh>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "ruff>=0.1",
]
gpu = [
    "genesis-world>=0.2; python_version<'3.14'",
]
dist = [
    "ray>=2.0",
]
analysis = [
    "scipy>=1.10",
]
dashboard = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
hpo = [
    "optuna>=3.0",
]
mfg = [
    "numpy-stl>=3.0",
]
deploy = [
    "onnx>=1.14",
    "onnxruntime>=1.16",
]
all = [
    "forgecraft[dev,gpu,dist,analysis,dashboard,hpo,mfg,deploy]",
]

[project.scripts]
forgecraft = "forgecraft.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forgecraft*"]
exclude = ["tests*", "forgecraft.testing*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["forgecraft"]

[tool.pytest.ini_options]
testpaths = ["tests", "forgecraft/testing"]
python_files = ["test_*.py"]
addopts = "--tb=short"
timeout = 300
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "gpu: tests requiring GPU (deselect with '-m \"not gpu\"')",
    "integration: integration tests",
]

[tool.coverage.run]
source = ["forgecraft"]
omit = [
    "forgecraft/testing/*",
    "forgecraft/*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
