# ForgeCraft Configuration File
# ============================

evolution:
  total_generations: 100
  population_size: 40
  eval_episodes: 6
  sim_steps: 3000
  settling_steps: 200
  grounding_steps: 500
  
  tournament_size: 5
  elite_count: 5
  crossover_rate: 0.3
  mutation_rate: 0.8
  
  patience: 20
  min_improvement: 0.001

simulation:
  dt: 0.002
  gravity: [-9.81, 0, 0]
  ground_friction: 1.0
  
  solver_iterations: 100
  solver_tolerance: 1.0e-6
  
  render_width: 640
  render_height: 480
  render_offscreen: false

viewer:
  auto_drive: true
  drive_speed: 0.8
  show_hud: true
  hud_refresh_rate: 10.0
  camera_distance: 2.0
  camera_elevation: -30.0

direct_drive:
  sim_steps: 1500
  n_frequencies: 3
  episodes_per_freq: 2
  
  signal_amplitude: 1.0
  signal_frequencies: [0.5, 1.0, 2.0]
  
  weight_displacement: 0.4
  weight_speed: 0.3
  weight_survival: 0.3

templates:
  seed: 42
  template_weights:
    differential_wheeled: 0.35
    quad_wheeled: 0.25
    bipedal: 0.15
    quadruped: 0.15
    crawler: 0.10
  min_parts: 4
  max_parts: 12
  size_variance: 0.15

output:
  results_dir: v11_results
  log_level: INFO
  save_checkpoints: true
  checkpoint_interval: 10
  export_format: stl
