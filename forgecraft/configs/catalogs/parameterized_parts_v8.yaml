      firmware: FOC (Field Oriented Control)
    thermal:
      heatsink: aluminum
      thermal_protection: yes
      max_operating_temp: 70           # °C
    size:
      length: [0.048, 0.051]
      width: [0.025, 0.027]
      height: [0.010, 0.013]
    actuated: false
    compatible_motors: ["robomaster_m3508"]
    cost_estimate: 200

  # ══════════════════════════════════════════════════════════
  # 类别 4: 传感系统（IMU+编码器+力觉）
  # ══════════════════════════════════════════════════════════

  # ──────────────────────────────────────
  # 4.1 MPU9250 九轴IMU (InvenSense/TDK)
  # ──────────────────────────────────────
  imu_mpu9250:
    category: sensor_inertial
    manufacturer: TDK-InvenSense
    part_number: MPU-9250
    geometry:
      type: chip_qfn
      color: [0.10, 0.10, 0.10, 1.0]  # 黑色芯片
      dimensions:
        length: 0.003                  # 3.0mm
        width: 0.003                   # 3.0mm
        thickness: 0.001               # 1.0mm
    physics:
      mass: 0.00014                    # 0.14g (极轻!)
    sensors:
      accelerometer:
        axes: 3
        range_options: [±2, ±4, ±8, ±16]  # g
        sensitivity_error: ±3          # %
        noise_density: 300              # µg/√Hz
      gyroscope:
        axes: 3
        range_options: [±250, ±500, ±1000, ±2000]  # °/s
        sensitivity_error: ±3          # %
        noise_density: 0.01             # dps/√Hz
      magnetometer_ak8963:
        axes: 3
        range: ±4800                   # µT
        resolution: 0.3                 # µT
    digital_motion_processor: true      # 内置DMP协处理器
    interfaces: ["I2C", "SPI"]
    i2c_address: [0x68, 0x69]          # 可选地址
    voltage_supply: [2.4, 3.6]         # V
    power_consumption: 3.5             # mA (典型)
    fifo_buffer: 1024                  # bytes
    interrupt_capabilities: true
    size:
      length: [0.003, 0.003]           # 固定尺寸
      width: [0.003, 0.003]
    actuated: false
    applications: ["姿态估计", "运动追踪", "平衡控制"]
    cost_estimate: 3                   # USD (便宜!)
    form_factor: qfn24_package

  # ──────────────────────────────────────
  # 4.2 BNO055 智能9轴绝对方向传感器
  # ──────────────────────────────────────
  imu_bno055:
    category: sensor_inertial_intelligent
    manufacturer: Bosch Sensortec
    part_number: BNO055
    geometry:
      type: module_lga
      color: [0.15, 0.15, 0.20, 1.0]
      dimensions:
        length: 0.0052                 # 5.2mm
        width: 0.0038                  # 3.8mm
        thickness: 0.0011              # 1.1mm
    physics:
      mass: 0.0012                     # ~1.2g (含封装)
    sensors:
      accelerometer: 3-axis, 14-bit
      gyroscope: 3-axis, 16-bit
      magnetometer: 3-axis
    fusion_processor:
      type: ARM Cortex-M0+            # 32位MCU
      algorithms: ["sensor_fusion", "kalman_filter"]
      output_formats:
        - quaternion                   # 四元数
        - euler_angles                 # 欧拉角
        - linear_acceleration         # 线性加速度
        - gravity_vector              # 重力向量
        - rotation_vector             # 旋转向量
    absolute_orientation: true         # 绝对方向(含磁力计)
    heading_accuracy: ±3              # degrees
    interfaces: ["I2C", "UART"]
    i2c_address: 0x28
    voltage_supply: [3.3, 5.5]        # V
    power_consumption: 12.3            # mA (@5V)
    operation_modes: 9                 # 多种工作模式
    size:
      length: [0.005, 0.006]
      width: [0.003, 0.005]
    actuated: false
    applications: ["即用型姿态", "VR/AR头显", "机器人导航"]
    cost_estimate: 18                 # USD
    advantage: "无需外部融合算法"

  # ──────────────────────────────────────
  # 4.3 Absolute Encoder (多圈绝对值编码器)
  # ──────────────────────────────────────
  encoder_absolute_multi_turn:
    category: sensor_position
    type: optical_or_magnetic
    resolution_options: [12-bit, 14-bit, 16-bit, 18-bit, 20-bit]
    interface_options: ["SSI", "BiSS-C", "EnDat 2.2", "CANopen", "EtherCAT"]
    accuracy: ±0.001° to ±0.02°       # 取决于分辨率
    repeatability: ±0.0005° to ±0.005°
    max_speed: 6000-12000             # RPM
    operating_temp: [-40, 105]         # °C
    protection_ip: IP64 to IP67
    shaft_diameter_options: [6mm, 8mm, 10mm, 12mm, 15mm]
    geometry:
      type: cylinder_hollow
      outer_diameter_range: [0.038, 0.058]  # 38-58mm
      length_range: [0.050, 0.090]
    physics:
      mass_range: [0.080, 0.250]
    applications: ["关节反馈", "伺服闭环", "CNC位置检测"]
    cost_estimate: 100-500            # USD (精度越高越贵)

  # ══════════════════════════════════════════════════════════
  # 类别 5: 控制系统（主控+通信）
  # ══════════════════════════════════════════════════════════

  # ──────────────────────────────────────
  # 5.1 STM32F429 主控制器
  # ──────────────────────────────────────
  mcu_stm32f429:
    category: microcontroller_main
    manufacturer: STMicroelectronics
    part_number: STM32F429IGT6
    architecture: ARM Cortex-M4
    clock_speed: 180                  # MHz
    flash_memory: 1024                # KB
    sram: 256                         # KB
    gpio_pins: 176
    peripherals:
      timers: 17 (advanced control)
      adc: 3 × 12-bit
      dac: 2 × 12-bit
      uart: 6
      spi: 4
      i2c: 3
      can: 2
      usb: OTG
      sdio: 1
      fmc: external_memory_interface
    math_fpu: yes                     # 硬件浮点单元
    dsp_instructions: yes            # DSP指令集
    package: LQFP176
    voltage_supply: [1.7, 3.6]       # V
    temperature_range: [-40, 105]     # °C
    typical_power: 250                # mA @ full load
    development_board: STM32F429 Discovery Kit
    rtos_support: ["FreeRTOS", "RT-Thread", "uC/OS-II"]
    ros_compatibility: ros1/ros2 (micro-ROS)
    geometry:
      type: pcb_rectangle
      dimensions: [0.080, 0.080, 0.002]  # 评估板尺寸
    physics:
      mass_board: 0.050              # 评估板~50g
    applications: ["机器人主控", "运动控制", "数据处理"]
    cost_estimate: 25                 # USD (芯片) / 60 (开发板)

  # ══════════════════════════════════════════════════════════
  # 类别 6: 连接件与结构件
  # ══════════════════════════════════════════════════════════

  # ──────────────────────────────────────
  # 6.1 6063-T5 铝合金方管 (2020/3030/4040系列)
  # ──────────────────────────────────────
  aluminum_extrusion_2020:
    category: structural
    material: Aluminum 6063-T5
    profile: 20mm × 20mm (2020 series)
    wall_thickness: 1.5                # mm
    geometry:
      type: hollow_square
      color: [0.75, 0.76, 0.78, 0.9]  # 银白氧化
      cross_section: 0.020 × 0.020     # m
    physics:
      density: 2700.0                  # kg/m³
      linear_density: 0.52             # kg/m (每米重量)
      yield_strength: 215              # MPa
      tensile_strength: 240            # MPa
      elastic_modulus: 68.9            # GPa
    mechanical_properties:
      moment_of_inertia_Ix: 6821       # mm⁴
      moment_of_inertia_Iy: 6821       # mm⁴
      section_modulus: 682             # mm³
    features:
      t_slot: 8mm                     # T型槽宽
      compatible_fasteners: M3, M4, M5
      anodized_surface: yes
      corrosion_resistant: yes
    size:
      length: [0.05, 1.5]              # 可切割长度范围
      width: fixed 0.020
      height: fixed 0.020
    actuated: false
    applications: ["机器人框架", "支架结构", "工作台"]
    cost_per_meter: 3                 # USD
    machinability: excellent

  # ──────────────────────────────────────
  # 6.2 碳纤维管 (轻量化臂杆)
  # ──────────────────────────────────────
  carbon_fiber_tube:
    category: structural_lightweight
    material: Carbon Fiber Composite (3K plain weave)
    geometry:
      type: hollow_cylinder
      color: [0.15, 0.15, 0.15, 1.0]  # 黑色
      outer_diameter_options: [0.008, 0.010, 0.012, 0.016, 0.020, 0.025, 0.030]
      wall_thickness_ratio: [0.05, 0.15]  # 壁厚/外径比
    physics:
      density: 1550.0                  # kg/m³ (比铝轻42%!)
      tensile_strength: 3500           # MPa (极高强度)
      elastic_modulus: 230             # GPa (轴向)
    mechanical_advantages:
      strength_to_weight: 5x vs aluminum
      stiffness_to_weight: 3x vs aluminum
      thermal_expansion: near_zero     # 近零热膨胀
      fatigue_life: excellent
    size:
      length: [0.05, 1.0]
      radius: [0.004, 0.015]
    actuated: false
    special_properties:
      lightweight: true
      high_stiffness_to_weight: true
      vibration_damping: moderate
    applications: ["机器人手臂", "无人机机架", "轻载连杆"]
    cost_per_meter: 15-50             # USD (取决于直径)
    manufacturing_method: roll_wrapped

  # ──────────────────────────────────────
  # 6.3 深沟球轴承 (标准件)
  # ──────────────────────────────────────
  bearing_deep_groove:
    category: fastener_rotational
    type: 6000-series deep groove ball bearing
    standard: ISO 15:2011 / DIN 625-1
    size_options:
      - model: 6000
        inner_dia: 0.010              # 10mm
        outer_dia: 0.026              # 26mm
        thickness: 0.008              # 8mm
        dynamic_load_C: 4.75          # kN
        static_load_C0: 1.81          # kN
        speed_limit grease: 28000     # RPM
        mass: 0.019                   # 19g
      - model: 6001
        inner_dia: 0.012
        outer_dia: 0.028
        thickness: 0.008
        dynamic_load_C: 5.07
        static_load_C0: 2.02
        mass: 0.021
      - model: 6002
        inner_dia: 0.015
        outer_dia: 0.032
        thickness: 0.009
        dynamic_load_C: 5.58
        static_load_C0: 2.38
        mass: 0.026
      - model: 6800 (薄壁系列)
        inner_dia: 0.010
        outer_dia: 0.019
        thickness: 0.005
        dynamic_load_C: 1.70
        static_load_C0: 0.82
        mass: 0.007
    geometry:
      type: ring
      color: [0.40, 0.40, 0.45, 1.0]  # 钢色
    physics:
      density: 7800.0                  # 轴承钢GCr15
    performance:
      friction_coefficient: 0.0015    # 极低
      accuracy_class: ABEC-1 to ABEC-7
      lubrication: grease or oil
      sealing_options: [open, ZZ (metal shield), 2RS (rubber seal)]
    actuated: false
    applications: ["关节旋转", "轮子支撑", "电机输出"]
    cost_estimate: 0.5-5              # USD (标准件便宜)

  # ══════════════════════════════════════════════════════════
  # 类别 7: 保留的创新零件 (从V7继承优化)
