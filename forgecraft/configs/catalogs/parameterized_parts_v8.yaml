    faces: [front, back]

  hemisphere_foot:
    geometry:
      type: hemisphere
      color: [0.30, 0.30, 0.30, 1.0]
    physics:
      mass: 0.025
      friction: [0.9, 0.80, 0.70]
      density: 1400.0
      damping: 0.08
    size:
      radius: [0.008, 0.045]
    actuated: false
    special_properties:
      grip_enhancement: true
      shock_absorption: true
      self_righting_capability: true
    faces: [flat_surface]

  rod:
    geometry:
      type: cylinder
      color: [0.35, 0.45, 0.55, 1.0]
    physics:
      mass: 0.05
      friction: [0.5, 0.01, 0.01]
      density: 1200.0
      mass_range: [0.008, 0.6]
    size:
      length: [0.015, 0.85]
      radius: [0.004, 0.07]
    actuated: false
    faces: [front, back]

  box_body:
    geometry:
      type: box
      color: [0.20, 0.25, 0.50, 1.0]
    physics:
      mass: 0.30
      friction: [0.7, 0.01, 0.01]
      density: 1200.0
      mass_range: [0.04, 2.2]
    size:
      length: [0.025, 0.55]
      width: [0.018, 0.45]
      height: [0.008, 0.28]
