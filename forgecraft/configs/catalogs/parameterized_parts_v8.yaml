evolution_config:
  population_size: 48                    # V8: 增加种群规模
  elite_count: 8
  generations: 150                       # V8: 更长进化周期

  reward_function_tuning:
    competition_objectives:
      autonomy_weight: 2.5               # 自主性优先
      performance_weight: 1.5            # 性能重要
      manufacturability_weight: 1.0      # 新增: 可制造性
      realism_weight: 1.2                # 新增: 真实性约束
      efficiency_weight: 0.8

    penalties:
      zero_motor_penalty: -8.0           # V8: 严惩零马达
      insufficient_motors_penalty: -4.0
      non_standard_parts_penalty: -3.0   # 使用非标零件惩罚
      overweight_penalty: -2.0           # 超重惩罚
      unrealistic_config_penalty: -5.0   # 不现实配置惩罚

    bonuses:
      real_part_usage_bonus: 0.8         # 使用真实零件奖励
      optimal_motor_count_bonus: 0.5
      balanced_design_bonus: 0.4         # 平衡设计奖励
      lightweight_bonus: 0.3             # 轻量化奖励
      high_efficiency_bonus: 0.35
      manufacturable_bonus: 0.4           # 可制造性奖励

  # V8: 真实性验证系统
  realism_validation:
    check_part_availability: true       # 验证零件可购性
    check_power_budget: true            # 验证功率预算
    check_thermal_limits: true          # 验证热限制
    check_structural_integrity: true    # 验证结构完整性
    min_system_efficiency: 25.0         # 最低系统效率(%)

  # UCB参数 (增强探索)
  ucb_parameters:
    exploration_constant: 1.82
    base_evaluations: 3
    max_additional_evaluations: 20
    elitism_focus_factor: 0.88

  # V8: 多目标帕累托前沿
  pareto_optimization:
    enabled: true
    objectives:
      - name: fitness_score
        maximize: true
      - name: autonomy_level
        maximize: true
      - name: manufacturability
        maximize: true
      - name: total_mass
        minimize: true
      - name: part_count
        minimize: true
    archive_size: 100
