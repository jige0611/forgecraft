# ==============================================================
# Stanford Pupper 风格零件箱
# 来源: Stanford Pupper (github.com/stanfordroboticsclub/StanfordQuadruped)
# 硬件特征:
#   12个 M2006 无刷齿轮电机 扭矩控制 (峰值1.8Nm 连续1.0Nm)
#   3D打印 PLA/尼龙 结构 + 碳纤维连接件
#   ~1.2kg 机身 + 12自由度四足
#   成本: $900-2000
# 论文: arXiv:2110.00736
# ==============================================================

constraints:
  max_depth: 5
  max_children_per_node: 4
  require_root: true
  symmetry: bilateral
  max_parts: 30

parts:
  # --- 机身 ---
  pupper_body_frame:
    geometry:
      type: box
      color: [0.15, 0.20, 0.45, 1.0]
    physics:
      mass: 0.35
      friction: [0.7, 0.01, 0.01]
    size:
      length: [0.10, 0.22]
      width:  [0.08, 0.16]
      height: [0.03, 0.06]
    actuated: false
    faces: [front, back, left, right, top, bottom]

  pupper_carbon_plate:
    geometry:
      type: box
      color: [0.20, 0.20, 0.20, 1.0]
    physics:
      mass: 0.04
      friction: [0.5, 0.01, 0.01]
    size:
      length: [0.06, 0.20]
      width:  [0.04, 0.14]
      height: [0.001, 0.004]
    actuated: false
    faces: [front, back, left, right]

  # --- 腿部 (Pupper 每条腿3段 + 3电机) ---
  # 髋关节电机 = 外展/内收
  pupper_hip_abductor:
    geometry:
      type: cylinder
      color: [0.70, 0.25, 0.15, 1.0]
    physics:
      mass: 0.10
      friction: [0.5, 0.01, 0.01]
    size:
      radius: [0.02, 0.05]
      length: [0.03, 0.06]
    actuated: true
    joint:
      type: hinge
      axis: [0, 1, 0]
      range: [-0.8, 0.8]
      torque: [0.5, 1.8]
      velocity: [10.0, 30.0]
      damping: 0.15
    faces: [front, back]

  # 髋关节电机 = 前摆/后摆
  pupper_hip_flexor:
    geometry:
      type: cylinder
      color: [0.75, 0.30, 0.20, 1.0]
    physics:
      mass: 0.10
      friction: [0.5, 0.01, 0.01]
    size:
      radius: [0.02, 0.05]
      length: [0.03, 0.06]
    actuated: true
    joint:
      type: hinge
      axis: [0, 1, 0]
      range: [-1.2, 1.2]
      torque: [0.5, 1.8]
      velocity: [15.0, 40.0]
      damping: 0.12
    faces: [front, back]

  # 膝关节电机
  pupper_knee:
    geometry:
      type: cylinder
      color: [0.80, 0.35, 0.25, 1.0]
    physics:
      mass: 0.09
      friction: [0.5, 0.01, 0.01]
    size:
      radius: [0.015, 0.04]
      length: [0.02, 0.05]
    actuated: true
    joint:
      type: hinge
      axis: [0, 1, 0]
      range: [-1.3, 0.3]
      torque: [0.3, 1.8]
      velocity: [10.0, 35.0]
      damping: 0.15
    faces: [front, back]

  # 大腿段
  pupper_upper_leg:
    geometry:
      type: cylinder
      color: [0.35, 0.40, 0.45, 1.0]
    physics:
      mass: 0.05
      friction: [0.5, 0.01, 0.01]
    size:
      length: [0.04, 0.15]
      radius: [0.01, 0.03]
    actuated: false
    faces: [front, back]

  # 小腿段
  pupper_lower_leg:
    geometry:
      type: cylinder
      color: [0.45, 0.45, 0.45, 1.0]
    physics:
      mass: 0.04
      friction: [0.5, 0.01, 0.01]
    size:
      length: [0.04, 0.16]
      radius: [0.008, 0.025]
    actuated: false
    faces: [front, back]

  # 脚垫
  pupper_foot:
    geometry:
      type: sphere
      color: [0.20, 0.20, 0.20, 1.0]
    physics:
      mass: 0.015
      friction: [1.0, 0.01, 0.01]
    size:
      radius: [0.015, 0.04]
    actuated: false
    faces: [top]
