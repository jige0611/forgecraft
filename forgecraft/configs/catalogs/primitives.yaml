# ==============================================================
# Primitives 零件箱 — 零人类设计偏见
#
# version: 1.0
# date: 2025-06
#
# 设计哲学:
#   不告诉 AI "机器人应该有腿/轮/身体"。
#   只给三个物理原语:
#     结构体 → 占据空间、承载质量、提供附着面
#     驱动器 → 在两个结构体之间施加力矩
#     触地点 → 与地面产生高摩擦接触
#
#   进化自己会发现:
#     - 要移动需要交替接触地面 → 涌现"腿"的概念
#     - 要高效需要质量分布 → 涌现"身体"的概念
#     - 要转向需要力矩矢量组合 → 涌现"关节"的概念
#
#   所有连续参数均可变异收敛到最优值。
# ==============================================================

constraints:
  max_depth: 10
  max_children_per_node: 6
  require_root: true
  symmetry: none
  max_parts: 60

parts:
  # ─────────────────────────────────────────────
  # 结构体 — 占据空间的物理块
  #
  # 可以是杆(cylinder)也可以是块(box)。
  # 形状由连续参数决定：length/width/height 比值
  # 自然覆盖：细长杆≈腿段, 扁平块≈身体, 立方体≈核心
  # ─────────────────────────────────────────────
  structure:
    geometry:
      type: cylinder
      color: [0.40, 0.42, 0.48, 1.0]
    physics:
      mass: 0.08
      friction: [0.6, 0.01, 0.01]
      density: 1200.0
      mass_range: [0.005, 2.0]
    size:
      length: [0.01, 1.00]
      radius: [0.003, 0.15]
    actuated: false
    faces: [front, back, left, right, top, bottom]

  # ─────────────────────────────────────────────
  # 驱动器 — 在两个结构体之间产生角位移
  #
  # 连续参数覆盖微舵机→工业伺服。
  # 关节限位、轴方向均可变异。
  # ─────────────────────────────────────────────
  actuator:
    geometry:
      type: cylinder
      color: [0.70, 0.30, 0.20, 1.0]
    physics:
      mass: 0.06
      friction: [0.5, 0.01, 0.01]
      density: 3000.0
      mass_range: [0.01, 0.5]
    size:
      length: [0.01, 0.15]
      radius: [0.008, 0.08]
    actuated: true
    joint:
      type: hinge
      axis: [0, 1, 0]
      range: [-3.0, 3.0]
      torque: [0.02, 50.0]
      velocity: [1.0, 100.0]
      damping: 0.1
    faces: [front, back, left, right]

  # ─────────────────────────────────────────────
  # 触地点 — 与地面高摩擦接触
  #
  # 半径连续可变：小≈尖点, 大≈球形脚垫。
  # 摩擦力可调：高摩擦≈抓地, 低摩擦≈滑动。
  # ─────────────────────────────────────────────
  contact:
    geometry:
      type: sphere
      color: [0.15, 0.15, 0.15, 1.0]
    physics:
      mass: 0.02
      friction: [1.2, 0.01, 0.01]
      density: 1500.0
      mass_range: [0.003, 0.3]
    size:
      radius: [0.005, 0.15]
    actuated: false
    faces: [top]
