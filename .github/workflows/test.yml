name: Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # 注: libgl1-mesa-glx 在 Ubuntu 24.04 已移除, 改用 libgl1
          sudo apt-get install -y -qq libgl1 libgl1-mesa-dri libosmesa6 libegl1 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest forgecraft/testing/test_suite.py -v --tb=short -x

      - name: Run integration tests
        run: |
          pytest forgecraft/testing/integration/ -v --tb=short --timeout=120

      - name: Run with coverage
        run: |
          pip install pytest-cov
          pytest forgecraft/testing/ --cov=forgecraft --cov-report=xml --cov-report=term -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
