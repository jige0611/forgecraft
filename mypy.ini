[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "mujoco.*",
    "gymnasium.*",
    "torch.*",
    "torchvision.*",
    "numpy.*",
    "networkx.*",
    "trimesh.*",
    "pyrender.*",
    "pymeshlab.*",
    "stable_baselines3.*",
]
ignore_missing_imports = true
